<table class="products-table">
  <thead>
    <tr>
      <th>Назва</th>
      <th>Категорія</th>
      <th>Ціна</th>
      <th>Наявність</th>
      <th>Статус ціни</th>
    </tr>
  </thead>
  <tbody>
    <tr
      *ngFor="let product of products"
      [ngStyle]="{
        'background-color': product.stockCount === 0 ? '#ffd6d6' : 'transparent'
      }"
    >
      <td>{{ product.name }}</td>
      <td>{{ product.category }}</td>
      <td>{{ product.price }} грн</td>
      <td>
        <span *ngIf="product.stockCount > 0">✅</span>
        <span *ngIf="product.stockCount === 0">❌</span>
      </td>
      <td [ngSwitch]="true">
        <span *ngSwitchCase="product.price < 50">Низька</span>
        <span *ngSwitchCase="product.price >= 50 && product.price <= 200">Середня</span>
        <span *ngSwitchCase="product.price > 200">Висока</span>
      </td>
    </tr>
  </tbody>
</table>
