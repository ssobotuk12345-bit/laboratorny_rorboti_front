<h2>Демонстрація директиви configurableHighlight</h2>

<p configurableHighlight [highlightColor]="'cyan'">
  Наведи на цей текст – фон стане блакитним
</p>

<div configurableHighlight [highlightColor]="'lightgreen'" style="padding: 10px; margin-top: 10px;">
  Наведи на цей блок – фон стане світло-зеленим
</div>

<p configurableHighlight style="margin-top: 10px;">
  Тут колір за замовчуванням (yellow)
</p>
